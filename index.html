<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account Tracking - Filtros avanzados</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 1rem;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f0f2f5;
    }
    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: white;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    #logo {
      max-height: 80px;
      width: auto;
    }
    header h1 {
      font-size: 1.5rem;
      color: #1e466e;
      margin: 0;
    }
    /* Panel de controles */
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: white;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      align-items: flex-start;
    }
    .filter-group {
      background: #f8f9fc;
      border-radius: 12px;
      padding: 0.5rem;
      min-width: 180px;
      border: 1px solid #ddd;
    }
    .filter-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.8rem;
      color: #1e466e;
    }
    .filter-group input.search-input {
      width: 100%;
      padding: 0.3rem;
      margin-bottom: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .checkbox-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      padding: 0.3rem;
    }
    .checkbox-list div {
      padding: 0.2rem 0;
      font-size: 0.85rem;
    }
    .checkbox-list input {
      margin-right: 0.4rem;
    }
    .select-all-btn {
      font-size: 0.7rem;
      background: #e9ecef;
      border: none;
      border-radius: 10px;
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      margin-bottom: 0.3rem;
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: #e9ecef;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .stats-bar span {
      background: white;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    table.dataTable thead th {
      background: #1e466e;
      color: white;
    }
    table.dataTable tbody tr.odd {
      background-color: #ffffff;
    }
    table.dataTable tbody tr.even {
      background-color: #f8f9fa;
    }
    .row-agendado {
      background-color: #24e368 !important;
      color: #032a18;
    }
    .row-2025 {
      background-color: #fff9c4 !important;
    }
    .row-2026-rango {
      background-color: #ffe0b2 !important;
    }
    .col-aux {
      display: none;
    }
    @media (max-width: 640px) {
      #logo { max-height: 50px; }
      header h1 { font-size: 1.2rem; }
      .filter-group { min-width: 140px; }
    }
  </style>
</head>
<body>
<header>
  <img src="CJJ.png" alt="CJJ Visas & Asesorías logo" id="logo" onerror="this.style.display='none'">
  <h1>📅 Account Tracking & Availability Calendar</h1>
</header>

<div id="controls"></div>
<div class="stats-bar" id="statsContainer">
  <span>Cargando...</span>
</div>

<table id="tbl" class="display stripe" style="width:100%">
  <thead>
    <tr><th>Server</th><th>Applicant</th><th>Date</th><th>Time</th><th>Message</th><th class="col-aux">PRIORITY</th><th class="col-aux">_ISO</th><th class="col-aux">_hasAgendado</th><th class="col-aux">_yearMonth</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script>
  (function() {
    // ---------- CONFIGURACIÓN DE COLORES (ajusta aquí el rango de meses) ----------
    const COLOR_RANGE = {
      year: '2026',
      monthsFrom: 4,   // abril
      monthsTo: 9      // septiembre (incluido)
    };
    // Si quieres colorear solo hasta julio, pon monthsFrom=1, monthsTo=7
    // ---------------------------------------------------------------------------

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function enrichItem(item) {
      const msg = (item.Message || '').toString();
      const hasAgendado = /(AGENDADO|AGENDAMIENTO EXITOSO)/i.test(msg);
      const priority = hasAgendado ? 1 : 0;
      let yearMonth = '';
      const dateMatch = msg.match(/\b(\d{4})-(\d{2})-\d{2}\b/);
      if (dateMatch) {
        yearMonth = `${dateMatch[1]}-${dateMatch[2]}`;
      }
      return {
        Server: item.Server || '',
        Aplicante: item.Aplicante || '',
        Date: item.Date || '',
        Time: item.Time || '',
        Message: msg,
        PRIORITY: priority,
        ISO: item.ISO || '',
        _hasAgendado: hasAgendado,
        _yearMonth: yearMonth
      };
    }

    // Variables globales
    let currentDataEnriched = [];
    let dataTable = null;
    let refreshTimer = null;
    let currentRefreshSec = 0;

    // Estado de los filtros múltiples
    let activeFilters = {
      server: new Set(),
      applicant: new Set(),
      availability: new Set()
    };

    // Para evitar bucles de actualización
    let updatingFilters = false;

    // Generar opciones de disponibilidad únicas desde los datos
    function getUniqueAvailabilityOptions(data) {
      const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const availSet = new Set();
      for (const row of data) {
        if (row._hasAgendado) availSet.add('AGENDADO');
        if (row._yearMonth) {
          const [year, mon] = row._yearMonth.split('-');
          availSet.add(`${year}-${monthNames[parseInt(mon,10)-1]}`);
        }
      }
      const agendadoFirst = Array.from(availSet).filter(v => v === 'AGENDADO');
      const others = Array.from(availSet).filter(v => v !== 'AGENDADO').sort((a,b) => {
        const [yearA, monA] = a.split('-');
        const [yearB, monB] = b.split('-');
        const monthIdx = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        if (yearA !== yearB) return parseInt(yearA) - parseInt(yearB);
        return monthIdx.indexOf(monA) - monthIdx.indexOf(monB);
      });
      return [...agendadoFirst, ...others];
    }

    // Obtener datos filtrados según los filtros activos (sin aplicar búsqueda global de DataTables)
    function getFilteredData() {
      return currentDataEnriched.filter(row => {
        if (activeFilters.server.size > 0 && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.applicant.size > 0 && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.availability.size > 0) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        return true;
      });
    }

    // Actualizar las opciones de los filtros (Server, Applicant, Availability) basado en los datos actuales SIN los filtros de sí mismo
    // Pero para escalonamiento, usamos los datos filtrados por los OTROS filtros.
    function rebuildFilterOptions() {
      if (updatingFilters) return;
      updatingFilters = true;

      // 1. Obtener datos filtrados por todos los filtros EXCEPTO el que estamos reconstruyendo (para cada uno)
      // Para servidor: aplicar filtros de applicant y availability
      const filterServerData = currentDataEnriched.filter(row => {
        if (activeFilters.applicant.size > 0 && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.availability.size > 0) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        return true;
      });
      const uniqueServers = [...new Set(filterServerData.map(r => r.Server))].sort();

      // Para applicant: aplicar filtros de server y availability
      const filterApplicantData = currentDataEnriched.filter(row => {
        if (activeFilters.server.size > 0 && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.availability.size > 0) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        return true;
      });
      const uniqueApplicants = [...new Set(filterApplicantData.map(r => r.Aplicante))].sort();

      // Para availability: aplicar filtros de server y applicant
      const filterAvailData = currentDataEnriched.filter(row => {
        if (activeFilters.server.size > 0 && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.applicant.size > 0 && !activeFilters.applicant.has(row.Aplicante)) return false;
        return true;
      });
      const availOptions = getUniqueAvailabilityOptions(filterAvailData);

      // Actualizar UI de cada filtro (checkbox lists)
      populateCheckboxList('server', uniqueServers, activeFilters.server);
      populateCheckboxList('applicant', uniqueApplicants, activeFilters.applicant);
      populateCheckboxList('availability', availOptions, activeFilters.availability);

      updatingFilters = false;
    }

    // Llenar un grupo de checkboxes con búsqueda
    function populateCheckboxList(filterId, options, selectedSet) {
      const container = $(`#${filterId}-list`);
      if (!container.length) return;
      const searchVal = $(`#search-${filterId}`).val().toLowerCase();
      let filteredOptions = options;
      if (searchVal) {
        filteredOptions = options.filter(opt => opt.toLowerCase().includes(searchVal));
      }
      let html = `<div><button type="button" class="select-all-btn" data-filter="${filterId}">Seleccionar todo</button></div>`;
      filteredOptions.forEach(opt => {
        const checked = selectedSet.has(opt) ? 'checked' : '';
        html += `<div><label><input type="checkbox" value="${escapeHtml(opt)}" ${checked}> ${escapeHtml(opt)}</label></div>`;
      });
      container.html(html);
      // Eventos a los checkboxes
      container.find('input[type="checkbox"]').on('change', function() {
        const val = $(this).val();
        if ($(this).prop('checked')) {
          activeFilters[filterId].add(val);
        } else {
          activeFilters[filterId].delete(val);
        }
        applyFiltersAndRefresh();
      });
      // Evento "seleccionar todo"
      container.find(`.select-all-btn`).off('click').on('click', function() {
        const allCurrent = container.find('input[type="checkbox"]').map(function() { return $(this).val(); }).get();
        if (allCurrent.length === activeFilters[filterId].size) {
          // si ya están todos, deseleccionar todos
          activeFilters[filterId].clear();
          container.find('input[type="checkbox"]').prop('checked', false);
        } else {
          activeFilters[filterId] = new Set(allCurrent);
          container.find('input[type="checkbox"]').prop('checked', true);
        }
        applyFiltersAndRefresh();
      });
    }

    // Aplicar filtros a DataTable y actualizar estadísticas y opciones escalonadas
    function applyFiltersAndRefresh() {
      if (!dataTable) return;
      // Obtener datos filtrados por los checkboxes
      const filtered = getFilteredData();
      // Actualizar DataTable con esos datos (reemplazar rows)
      dataTable.clear();
      dataTable.rows.add(filtered);
      dataTable.draw();
      // Actualizar estadísticas basadas en filtered
      updateStatsDisplay(filtered);
      // Reconstruir opciones de los filtros (escalonamiento)
      rebuildFilterOptions();
      // Guardar estado en localStorage
      saveFiltersToStorage();
    }

    function updateStatsDisplay(filteredData) {
      const total = filteredData.length;
      const agendados = filteredData.filter(r => r._hasAgendado).length;
      const disponibilidad2026 = filteredData.filter(r => r._yearMonth && r._yearMonth.startsWith('2026')).length;
      $('#statsContainer').html(`
        <span>📊 Total: ${total}</span>
        <span>✅ Agendados: ${agendados}</span>
        <span>📅 Disp. 2026: ${disponibilidad2026}</span>
        <span>🔄 Última actualización: ${new Date().toLocaleTimeString()}</span>
      `);
    }

    // Cargar JSON y actualizar todo
    async function loadAndRefreshData() {
      try {
        const resp = await fetch('latest.json?t=' + Date.now());
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const raw = await resp.json();
        if (!Array.isArray(raw)) throw new Error('JSON no es array');
        currentDataEnriched = raw.map(enrichItem);
        // Reiniciar filtros activos (opcional, mantener los que había en localStorage)
        restoreFiltersFromStorage();
        // Aplicar filtros y refrescar tabla
        applyFiltersAndRefresh();
      } catch (err) {
        console.error(err);
        $('#statsContainer').html('<span>⚠️ Error al cargar datos. Reintentando...</span>');
      }
    }

    // Construir la UI de los filtros con checkboxes y búsqueda
    function buildFilterUI() {
      const controlsDiv = $('#controls');
      controlsDiv.empty();

      // Filtro Server
      const serverGroup = $(`<div class="filter-group">
        <label>🖥️ Servidor</label>
        <input type="text" class="search-input" id="search-server" placeholder="Buscar...">
        <div id="server-list" class="checkbox-list"></div>
      </div>`);
      // Filtro Applicant
      const applicantGroup = $(`<div class="filter-group">
        <label>👤 Solicitante</label>
        <input type="text" class="search-input" id="search-applicant" placeholder="Buscar...">
        <div id="applicant-list" class="checkbox-list"></div>
      </div>`);
      // Filtro Availability
      const availGroup = $(`<div class="filter-group">
        <label>📆 Disponibilidad</label>
        <input type="text" class="search-input" id="search-availability" placeholder="Buscar...">
        <div id="availability-list" class="checkbox-list"></div>
      </div>`);

      controlsDiv.append(serverGroup, applicantGroup, availGroup);

      // Botón de refresco automático y exportación
      const refreshGroup = $(`<div class="filter-group">
        <label>🔄 Refresco</label>
        <select id="refresh-interval">
          <option value="0">Detener</option>
          <option value="5">5 seg</option>
          <option value="10">10 seg</option>
          <option value="30">30 seg</option>
          <option value="60">60 seg</option>
        </select>
        <button id="refresh-now" style="margin-top:5px; width:100%;">▶️ Ahora</button>
        <button id="export-csv" style="margin-top:5px; width:100%;">📎 Exportar CSV</button>
        <span class="countdown" style="font-size:0.7rem;"></span>
      </div>`);
      controlsDiv.append(refreshGroup);

      // Eventos de búsqueda en cada filtro
      $('#search-server').on('keyup', () => { rebuildFilterOptions(); });
      $('#search-applicant').on('keyup', () => { rebuildFilterOptions(); });
      $('#search-availability').on('keyup', () => { rebuildFilterOptions(); });

      // Refresco automático
      const savedInterval = parseInt(localStorage.getItem('refresh-interval') || '0', 10);
      $('#refresh-interval').val(savedInterval);
      setRefreshInterval(savedInterval);
      $('#refresh-interval').on('change', function() { setRefreshInterval(parseInt($(this).val(),10)); });
      $('#refresh-now').on('click', () => loadAndRefreshData());
      $('#export-csv').on('click', () => exportToCSV());
    }

    function setRefreshInterval(seconds) {
      if (refreshTimer) clearInterval(refreshTimer);
      currentRefreshSec = seconds;
      localStorage.setItem('refresh-interval', seconds);
      if (seconds > 0) {
        let remaining = seconds;
        const $cd = $('#refresh-group .countdown');
        const interval = setInterval(() => {
          if (remaining <= 1) {
            // la recarga ocurrirá en el timer principal
          } else {
            remaining--;
            $cd.text(` (${remaining}s)`);
          }
        }, 1000);
        refreshTimer = setInterval(() => {
          loadAndRefreshData();
          remaining = seconds;
        }, seconds * 1000);
      } else {
        $('.countdown').text('');
      }
    }

    function exportToCSV() {
      if (!dataTable) return;
      const filteredData = getFilteredData();
      const headers = ['Server', 'Applicant', 'Date', 'Time', 'Message'];
      const csvRows = [headers.join(',')];
      for (const row of filteredData) {
        const line = headers.map(h => {
          let val = row[h] || '';
          if (h === 'Message') val = row.Message.replace(/"/g, '""');
          return `"${val}"`;
        }).join(',');
        csvRows.push(line);
      }
      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.setAttribute('download', 'export_tracking.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function saveFiltersToStorage() {
      const toSave = {
        server: Array.from(activeFilters.server),
        applicant: Array.from(activeFilters.applicant),
        availability: Array.from(activeFilters.availability)
      };
      localStorage.setItem('multi_filters', JSON.stringify(toSave));
    }

    function restoreFiltersFromStorage() {
      const saved = localStorage.getItem('multi_filters');
      if (saved) {
        try {
          const obj = JSON.parse(saved);
          activeFilters.server = new Set(obj.server || []);
          activeFilters.applicant = new Set(obj.applicant || []);
          activeFilters.availability = new Set(obj.availability || []);
        } catch(e) {}
      } else {
        activeFilters = { server: new Set(), applicant: new Set(), availability: new Set() };
      }
    }

    // Inicializar DataTable con rowCallback que usa COLOR_RANGE configurable
    function initDataTable() {
      if (dataTable) dataTable.destroy();
      dataTable = $('#tbl').DataTable({
        data: [], // inicial vacío
        columns: [
          { data: 'Server', render: v => escapeHtml(v) },
          { data: 'Aplicante', render: v => escapeHtml(v) },
          { data: 'Date', render: v => escapeHtml(v) },
          { data: 'Time', render: v => escapeHtml(v) },
          { data: 'Message', render: v => escapeHtml(v) },
          { data: 'PRIORITY' },
          { data: 'ISO' },
          { data: '_hasAgendado' },
          { data: '_yearMonth' }
        ],
        columnDefs: [
          { targets: [5,6,7,8], visible: false, searchable: false }
        ],
        order: [[5, 'desc'], [6, 'desc']],
        pageLength: 25,
        lengthMenu: [[10,25,50,100,-1], [10,25,50,100,"Todos"]],
        rowCallback: function(row, rowData) {
          $(row).removeClass('row-agendado row-2025 row-2026-rango');
          if (rowData._hasAgendado) {
            $(row).addClass('row-agendado');
            return;
          }
          const ym = rowData._yearMonth;
          if (ym) {
            const [year, mon] = ym.split('-');
            if (year === '2025') $(row).addClass('row-2025');
            else if (year === COLOR_RANGE.year && parseInt(mon,10) >= COLOR_RANGE.monthsFrom && parseInt(mon,10) <= COLOR_RANGE.monthsTo) {
              $(row).addClass('row-2026-rango');
            }
          }
        },
        language: { search: "Buscar global:", lengthMenu: "Mostrar _MENU_", info: "Mostrando _START_–_END_ de _TOTAL_", paginate: { first: "Primero", last: "Último", next: "Siguiente", previous: "Anterior" } }
      });
      // Eliminar el filtro de búsqueda global de DataTables para evitar conflictos (opcional)
      // Lo dejamos pero no interfiere con los nuestros.
    }

    // Arranque
    buildFilterUI();
    initDataTable();
    loadAndRefreshData();
  })();
</script>
</body>
</html>
