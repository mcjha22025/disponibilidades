<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account Tracking - Advanced Filters</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 1rem;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f0f2f5;
    }
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      background: white;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .left-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .left-area h1 {
      font-size: 1.5rem;
      color: #1e466e;
      margin: 0;
    }
    #logo {
      max-height: 360px;
      width: auto;
      display: block;
    }
    .filters-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: flex-end;
      flex: 1;
      min-width: 280px;
    }
    .filter-group {
      background: #f8f9fc;
      border-radius: 12px;
      padding: 0.5rem;
      min-width: 180px;
      border: 1px solid #ddd;
    }
    .filter-group.wide {
      min-width: 240px;
    }
    .filter-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.8rem;
      color: #1e466e;
    }
    .filter-group input.search-input {
      width: 100%;
      padding: 0.3rem;
      margin-bottom: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .checkbox-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      padding: 0.3rem;
    }
    /* Espacio reducido entre opciones */
    .checkbox-list div {
      padding: 0.2rem 0;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
    }
    .checkbox-list input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 0.5rem;
      cursor: pointer;
      transform: scale(1);
    }
    .filter-buttons {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
    }
    .filter-buttons button {
      font-size: 0.7rem;
      background: #e9ecef;
      border: none;
      border-radius: 10px;
      padding: 0.1rem 0.3rem;
      cursor: pointer;
      flex: 1;
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: #e9ecef;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .stats-bar span {
      background: white;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .dataTables_wrapper {
      position: relative;
      overflow-x: auto;
    }
    table.dataTable {
      width: 100%;
      border-collapse: collapse;
    }
    table.dataTable thead th {
      background: #1e466e;
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #0f2b44;
    }
    table.dataTable tbody tr.odd {
      background-color: #ffffff;
    }
    table.dataTable tbody tr.even {
      background-color: #f8f9fa;
    }
    .row-agendado {
      background-color: #24e368 !important;
      color: #032a18;
    }
    .row-2025 {
      background-color: #fff9c4 !important;
    }
    .row-2026-rango {
      background-color: #ffe0b2 !important;
    }
    .col-aux {
      display: none;
    }
    @media (max-width: 768px) {
      .main-header { flex-direction: column; }
      .filters-container { justify-content: flex-start; }
      .filter-group, .filter-group.wide { min-width: 100%; }
      #logo { max-height: 180px; }
      .left-area h1 { font-size: 1.2rem; }
      .checkbox-list div { padding: 0.3rem 0; } /* un poco más en móvil pero aún compacto */
    }
  </style>
</head>
<body>
<div class="main-header">
  <div class="left-area">
    <h1>📅 Account Tracking & Availability Calendar</h1>
    <img src="CJJ.png" alt="CJJ Visas & Asesorías logo" id="logo" onerror="this.style.display='none'">
  </div>
  <div id="controls" class="filters-container"></div>
</div>

<div class="stats-bar" id="statsContainer">
  <span>Loading...</span>
</div>

<table id="tbl" class="display stripe" style="width:100%">
  <thead>
    <tr><th>Server</th><th>Applicant</th><th>Date</th><th>Time</th><th>Message</th><th class="col-aux">PRIORITY</th><th class="col-aux">_ISO</th><th class="col-aux">_hasAgendado</th><th class="col-aux">_yearMonth</th><th class="col-aux">_statusColor</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script>
  (function() {
    const COLOR_RANGE = {
      year: '2026',
      monthsFrom: 1,
      monthsTo: 12
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function enrichItem(item) {
      const msg = (item.Message || '').toString();
      const hasAgendado = /(AGENDADO|AGENDAMIENTO EXITOSO)/i.test(msg);
      const priority = hasAgendado ? 1 : 0;
      let yearMonth = '';
      const dateMatch = msg.match(/\b(\d{4})-(\d{2})-\d{2}\b/);
      if (dateMatch) {
        yearMonth = `${dateMatch[1]}-${dateMatch[2]}`;
      }
      let statusColor = '';
      if (hasAgendado) statusColor = 'Agendado';
      else if (yearMonth && yearMonth.startsWith('2025')) statusColor = '2025';
      else if (yearMonth && yearMonth.startsWith(COLOR_RANGE.year)) {
        const mon = parseInt(yearMonth.split('-')[1], 10);
        if (mon >= COLOR_RANGE.monthsFrom && mon <= COLOR_RANGE.monthsTo) statusColor = '2026 Range';
        else statusColor = '';
      }
      return {
        Server: item.Server || '',
        Aplicante: item.Aplicante || '',
        Date: item.Date || '',
        Time: item.Time || '',
        Message: msg,
        PRIORITY: priority,
        ISO: item.ISO || '',
        _hasAgendado: hasAgendado,
        _yearMonth: yearMonth,
        _statusColor: statusColor
      };
    }

    let currentDataEnriched = [];
    let dataTable = null;
    let refreshTimer = null;
    let activeFilters = {
      server: new Set(),
      applicant: new Set(),
      availability: new Set(),
      status: new Set()
    };
    let updatingFilters = false;

    function getUniqueAvailabilityOptions(data) {
      const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const availSet = new Set();
      for (const row of data) {
        if (row._hasAgendado) availSet.add('AGENDADO');
        if (row._yearMonth) {
          const [year, mon] = row._yearMonth.split('-');
          availSet.add(`${year}-${monthNames[parseInt(mon,10)-1]}`);
        }
      }
      const agendado = Array.from(availSet).filter(v => v === 'AGENDADO');
      const others = Array.from(availSet).filter(v => v !== 'AGENDADO');
      others.sort((a,b) => {
        const [yearA, monA] = a.split('-');
        const [yearB, monB] = b.split('-');
        const monthIdx = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        if (yearA !== yearB) return parseInt(yearA) - parseInt(yearB);
        return monthIdx.indexOf(monA) - monthIdx.indexOf(monB);
      });
      return [...agendado, ...others];
    }

    function getFilteredData() {
      return currentDataEnriched.filter(row => {
        if (activeFilters.server.size && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.applicant.size && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.availability.size) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        if (activeFilters.status.size && !activeFilters.status.has(row._statusColor)) return false;
        return true;
      });
    }

    function rebuildFilterOptions() {
      if (updatingFilters) return;
      updatingFilters = true;

      const filterServerData = currentDataEnriched.filter(row => {
        if (activeFilters.applicant.size && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.availability.size) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        if (activeFilters.status.size && !activeFilters.status.has(row._statusColor)) return false;
        return true;
      });
      const uniqueServers = [...new Set(filterServerData.map(r => r.Server))].sort();

      const filterApplicantData = currentDataEnriched.filter(row => {
        if (activeFilters.server.size && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.availability.size) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        if (activeFilters.status.size && !activeFilters.status.has(row._statusColor)) return false;
        return true;
      });
      const uniqueApplicants = [...new Set(filterApplicantData.map(r => r.Aplicante))].sort();

      const filterAvailData = currentDataEnriched.filter(row => {
        if (activeFilters.server.size && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.applicant.size && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.status.size && !activeFilters.status.has(row._statusColor)) return false;
        return true;
      });
      const availOptions = getUniqueAvailabilityOptions(filterAvailData);

      const filterStatusData = currentDataEnriched.filter(row => {
        if (activeFilters.server.size && !activeFilters.server.has(row.Server)) return false;
        if (activeFilters.applicant.size && !activeFilters.applicant.has(row.Aplicante)) return false;
        if (activeFilters.availability.size) {
          let match = false;
          for (let opt of activeFilters.availability) {
            if (opt === 'AGENDADO' && row._hasAgendado) { match = true; break; }
            if (opt !== 'AGENDADO') {
              const [year, monAbbr] = opt.split('-');
              const monthMap = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
              const targetMonth = monthMap[monAbbr];
              if (row._yearMonth === `${year}-${targetMonth}`) { match = true; break; }
            }
          }
          if (!match) return false;
        }
        return true;
      });
      const uniqueStatuses = [...new Set(filterStatusData.map(r => r._statusColor).filter(s => s !== ''))].sort();

      populateCheckboxList('server', uniqueServers, activeFilters.server);
      populateCheckboxList('applicant', uniqueApplicants, activeFilters.applicant);
      populateCheckboxList('availability', availOptions, activeFilters.availability);
      populateCheckboxList('status', uniqueStatuses, activeFilters.status);

      updatingFilters = false;
    }

    function populateCheckboxList(filterId, options, selectedSet) {
      const container = $(`#${filterId}-list`);
      if (!container.length) return;
      const searchVal = $(`#search-${filterId}`).val().toLowerCase();
      let filteredOptions = options;
      if (searchVal) {
        filteredOptions = options.filter(opt => opt.toLowerCase().includes(searchVal));
      }
      let html = `<div class="filter-buttons">
                    <button class="select-all-btn" data-filter="${filterId}">Select all</button>
                    <button class="deselect-all-btn" data-filter="${filterId}">Deselect all</button>
                  </div>`;
      filteredOptions.forEach(opt => {
        const checked = selectedSet.has(opt) ? 'checked' : '';
        html += `<div><label><input type="checkbox" value="${escapeHtml(opt)}" ${checked}> ${escapeHtml(opt)}</label></div>`;
      });
      container.html(html);
      container.find('input[type="checkbox"]').on('change', function() {
        const val = $(this).val();
        if ($(this).prop('checked')) selectedSet.add(val);
        else selectedSet.delete(val);
        applyFiltersAndRefresh();
      });
      container.find('.select-all-btn').off('click').on('click', function() {
        const allCurrent = container.find('input[type="checkbox"]').map(function() { return $(this).val(); }).get();
        selectedSet.clear();
        allCurrent.forEach(v => selectedSet.add(v));
        container.find('input[type="checkbox"]').prop('checked', true);
        applyFiltersAndRefresh();
      });
      container.find('.deselect-all-btn').off('click').on('click', function() {
        selectedSet.clear();
        container.find('input[type="checkbox"]').prop('checked', false);
        applyFiltersAndRefresh();
      });
    }

    function applyFiltersAndRefresh() {
      if (!dataTable) return;
      const filtered = getFilteredData();
      dataTable.clear();
      dataTable.rows.add(filtered);
      dataTable.draw();
      updateStatsDisplay(filtered);
      rebuildFilterOptions();
      saveFiltersToStorage();
    }

    function updateStatsDisplay(filteredData) {
      const total = filteredData.length;
      const agendados = filteredData.filter(r => r._hasAgendado).length;
      const disponibilidad2026 = filteredData.filter(r => r._yearMonth && r._yearMonth.startsWith('2026')).length;
      $('#statsContainer').html(`
        <span>📊 Total: ${total}</span>
        <span>✅ Agendados: ${agendados}</span>
        <span>📅 Disp. 2026: ${disponibilidad2026}</span>
        <span>🔄 Last Update: ${new Date().toLocaleTimeString()}</span>
      `);
    }

    async function loadAndRefreshData() {
      try {
        const resp = await fetch('latest.json?t=' + Date.now());
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const raw = await resp.json();
        if (!Array.isArray(raw)) throw new Error('JSON is not an array');
        currentDataEnriched = raw.map(enrichItem);
        restoreFiltersFromStorage();
        applyFiltersAndRefresh();
      } catch (err) {
        console.error(err);
        $('#statsContainer').html('<span>⚠️ Error loading data. Retrying...</span>');
      }
    }

    function buildFilterUI() {
      const controlsDiv = $('#controls');
      controlsDiv.empty();

      const serverGroup = $(`<div class="filter-group wide">
        <label>🖥️ Server</label>
        <input type="text" class="search-input" id="search-server" placeholder="Search...">
        <div id="server-list" class="checkbox-list"></div>
      </div>`);
      const applicantGroup = $(`<div class="filter-group wide">
        <label>👤 Applicant</label>
        <input type="text" class="search-input" id="search-applicant" placeholder="Search...">
        <div id="applicant-list" class="checkbox-list"></div>
      </div>`);
      const availGroup = $(`<div class="filter-group">
        <label>📆 Availability</label>
        <input type="text" class="search-input" id="search-availability" placeholder="Search...">
        <div id="availability-list" class="checkbox-list"></div>
      </div>`);
      const statusGroup = $(`<div class="filter-group">
        <label>🎨 Status</label>
        <input type="text" class="search-input" id="search-status" placeholder="Search...">
        <div id="status-list" class="checkbox-list"></div>
      </div>`);
      const refreshGroup = $(`<div class="filter-group">
        <label>🔄 Refresh</label>
        <select id="refresh-interval">
          <option value="0">Stop</option>
          <option value="15">15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
        <button id="refresh-now" style="margin-top:5px; width:100%;">Now</button>
        <button id="export-csv" style="margin-top:5px; width:100%;">📎 Export CSV</button>
        <span class="countdown" style="font-size:0.7rem;"></span>
      </div>`);

      controlsDiv.append(serverGroup, applicantGroup, availGroup, statusGroup, refreshGroup);

      $('#search-server, #search-applicant, #search-availability, #search-status').on('keyup', () => rebuildFilterOptions());

      const savedInterval = parseInt(localStorage.getItem('refresh-interval') || '0', 10);
      $('#refresh-interval').val(savedInterval);
      setRefreshInterval(savedInterval);
      $('#refresh-interval').on('change', function() { setRefreshInterval(parseInt($(this).val(),10)); });
      $('#refresh-now').on('click', () => loadAndRefreshData());
      $('#export-csv').on('click', () => exportToCSV());
    }

    function setRefreshInterval(seconds) {
      if (refreshTimer) clearInterval(refreshTimer);
      localStorage.setItem('refresh-interval', seconds);
      if (seconds > 0) {
        let remaining = seconds;
        const $cd = $('#refresh-group .countdown');
        const interval = setInterval(() => {
          if (remaining <= 1) { /* do nothing */ }
          else {
            remaining--;
            $cd.text(` (${remaining}s)`);
          }
        }, 1000);
        refreshTimer = setInterval(() => {
          loadAndRefreshData();
          remaining = seconds;
        }, seconds * 1000);
      } else {
        $('.countdown').text('');
      }
    }

    function exportToCSV() {
      if (!dataTable) return;
      const filteredData = getFilteredData();
      const headers = ['Server', 'Applicant', 'Date', 'Time', 'Message'];
      let csvContent = "\uFEFF" + headers.join(';') + "\n";
      for (const row of filteredData) {
        const rowData = [
          row.Server || '',
          row.Aplicante || '',
          row.Date || '',
          row.Time || '',
          (row.Message || '').replace(/[\n\r]+/g, ' ').replace(/;/g, ',')
        ];
        csvContent += rowData.join(';') + "\n";
      }
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.setAttribute('download', 'export_tracking.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function saveFiltersToStorage() {
      const toSave = {
        server: Array.from(activeFilters.server),
        applicant: Array.from(activeFilters.applicant),
        availability: Array.from(activeFilters.availability),
        status: Array.from(activeFilters.status)
      };
      localStorage.setItem('multi_filters', JSON.stringify(toSave));
    }

    function restoreFiltersFromStorage() {
      const saved = localStorage.getItem('multi_filters');
      if (saved) {
        try {
          const obj = JSON.parse(saved);
          activeFilters.server = new Set(obj.server || []);
          activeFilters.applicant = new Set(obj.applicant || []);
          activeFilters.availability = new Set(obj.availability || []);
          activeFilters.status = new Set(obj.status || []);
        } catch(e) {}
      } else {
        activeFilters = { server: new Set(), applicant: new Set(), availability: new Set(), status: new Set() };
      }
    }

    function initDataTable() {
      if (dataTable) dataTable.destroy();
      dataTable = $('#tbl').DataTable({
        data: [],
        columns: [
          { data: 'Server', render: v => escapeHtml(v) },
          { data: 'Aplicante', render: v => escapeHtml(v) },
          { data: 'Date', render: v => escapeHtml(v) },
          { data: 'Time', render: v => escapeHtml(v) },
          { data: 'Message', render: v => escapeHtml(v) },
          { data: 'PRIORITY' },
          { data: 'ISO' },
          { data: '_hasAgendado' },
          { data: '_yearMonth' },
          { data: '_statusColor' }
        ],
        columnDefs: [
          { targets: [5,6,7,8,9], visible: false, searchable: false }
        ],
        order: [[5, 'desc'], [6, 'desc']],
        pageLength: 25,
        lengthMenu: [[10,25,50,100,-1], [10,25,50,100,"All"]],
        rowCallback: function(row, rowData) {
          $(row).removeClass('row-agendado row-2025 row-2026-rango');
          if (rowData._hasAgendado) {
            $(row).addClass('row-agendado');
            return;
          }
          const ym = rowData._yearMonth;
          if (ym) {
            const [year, mon] = ym.split('-');
            if (year === '2025') $(row).addClass('row-2025');
            else if (year === COLOR_RANGE.year && parseInt(mon,10) >= COLOR_RANGE.monthsFrom && parseInt(mon,10) <= COLOR_RANGE.monthsTo) {
              $(row).addClass('row-2026-rango');
            }
          }
        },
        language: { search: "Global search:", lengthMenu: "Show _MENU_", info: "Showing _START_–_END_ of _TOTAL_", paginate: { first: "First", last: "Last", next: "Next", previous: "Prev" } }
      });
    }

    buildFilterUI();
    initDataTable();
    loadAndRefreshData();
  })();
</script>
</body>
</html>
